# Render生产环境配置

server:
  port: \${PORT:8080}

spring:
  application:
    name: handwriting-input-app

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: \${DATABASE_URL:jdbc:postgresql://localhost:5432/handwriting_input_app}
    username: \${DATABASE_USERNAME:handwriting}
    password: \${DATABASE_PASSWORD:}

  redis:
    host: \${REDIS_HOST:localhost}
    port: \${REDIS_PORT:6379}
    password: \${REDIS_PASSWORD:}

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

jwt:
  secret: \${JWT_SECRET:1234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456}
  expiration: 604800000
  header: Authorization
  prefix: Bearer

springfox:
  documentation:
    enabled: false

app:
  feature:
    model-path: /models/feature-model.h5
    extraction-timeout: 60
  upload:
    base-path: ./uploads
    max-file-size: 10485760
    handwriting-path: ./uploads/handwriting
    fonts-path: ./uploads/fonts
    avatars-path: ./uploads/avatars

# 生产环境日志配置
logging:
  level:
    root: WARN
    com.handwriting: INFO
  pattern:
    console: \"%d{yyyy-MM-dd HH:mm:ss} - %msg%n\"
  file:
    name: /app/logs/handwriting-input-app.log
    max-size: 100MB
    max-history: 7
