services:
  - type: web
    name: handwriting-input-app
    env: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/handwriting-input-app-1.0.0.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: handwriting-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: handwriting-redis
          property: connectionString

databases:
  - name: handwriting-db
    databaseName: handwriting_input_app
    user: handwriting
    plan: free

redis:
  - name: handwriting-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
